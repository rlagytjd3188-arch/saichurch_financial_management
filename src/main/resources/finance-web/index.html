<!doctype html>
<html lang="ko">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>사이교회 재무관리</title>
  <style>
    :root {
      --blue: #2596cc;
      --ink: #30465b;
      --muted: #78909e;
      --line: #e1e8ed;
      --bg: #f4f7fa;
      --red: #b85555;
    }
    * {
      box-sizing: border-box;
    }
    [hidden] {
      display: none !important;
    }
    body {
      margin: 0;
      font:
        14px system-ui,
        "Malgun Gothic",
        sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    button,
    input,
    select,
    textarea {
      font: inherit;
      border: 1px solid #d4dfe7;
      border-radius: 7px;
      padding: 10px;
      background: white;
      color: inherit;
    }
    button {
      cursor: pointer;
    }
    button.primary {
      background: var(--blue);
      color: white;
      border-color: var(--blue);
    }
    button:hover {
      filter: brightness(0.96);
    }
    header {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 20px 4vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    header b {
      font-size: 22px;
    }
    header small {
      color: var(--muted);
    }
    nav {
      display: flex;
      gap: 8px;
      padding: 17px 4vw;
      overflow: auto;
      white-space: nowrap;
    }
    nav button.active {
      background: var(--ink);
      color: white;
    }
    main {
      max-width: 1450px;
      margin: auto;
      padding: 10px 4vw 40px;
    }
    h1 {
      font-size: 26px;
    }
    h2 {
      font-size: 18px;
    }
    h3 {
      font-size: 15px;
    }
    p {
      line-height: 1.7;
    }
    .toolbar,
    .actions {
      display: flex;
      align-items: end;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .toolbar label,
    label {
      display: grid;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
      padding: 24px;
      margin: 18px 0;
      overflow: hidden;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .cards .card {
      margin: 0;
    }
    .cards small {
      display: block;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .cards strong {
      font-size: 24px;
    }
    .scroll {
      overflow: auto;
      max-height: 650px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      white-space: nowrap;
    }
    th,
    td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
    }
    th {
      background: #f6f9fb;
      position: sticky;
      top: 0;
    }
    td.num,
    th.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    tr.click {
      cursor: pointer;
    }
    tr.click:hover {
      background: #eff8fc;
    }
    .notice {
      background: #eaf4fb;
      padding: 14px;
      border-radius: 8px;
      line-height: 1.7;
      margin: 15px 0;
    }
    .error {
      color: var(--red);
      background: #fff0f0;
    }
    .muted {
      color: var(--muted);
      font-size: 12px;
    }
    .badge {
      background: #eaf4ef;
      color: #3c7962;
      border-radius: 5px;
      padding: 4px 8px;
      font-size: 11px;
    }
    .bad {
      color: var(--red);
    }
    .chart {
      min-height: 240px;
    }
    .chart svg {
      width: 100%;
      height: auto;
      max-height: 420px;
    }
    .chart svg text {
      font-family: inherit;
    }
    .chart [data-point] {
      cursor: pointer;
    }
    .legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px;
      font-size: 12px;
    }
    .legend label {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    .form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .form .full {
      grid-column: 1/-1;
    }
    .login {
      width: 420px;
      max-width: 95vw;
      margin: 12vh auto;
    }
    .login label {
      margin: 20px 0;
    }
    dialog {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px;
      width: 750px;
      max-width: 95vw;
      max-height: 90vh;
      overflow: auto;
    }
    dialog::backdrop {
      background: #20354988;
    }
    dialog input,
    dialog select {
      width: 100%;
    }
    #message {
      white-space: pre-wrap;
    }
    .only-table .chart,
    .only-table .legend {
      display: none;
    }
    .only-chart .chart-table {
      display: none;
    }
    .print-title {
      display: none;
    }
    a {
      color: #2081b5;
    }
    .public-hide {
      display: none !important;
    }
    footer {
      color: var(--muted);
      font-size: 11px;
      margin-top: 30px;
      border-top: 1px solid var(--line);
      padding-top: 20px;
    }
    @media (max-width: 750px) {
      header {
        padding: 18px;
      }
      header b {
        font-size: 19px;
      }
      header small {
        display: none;
      }
      nav {
        padding: 12px;
      }
      .cards {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .cards strong {
        font-size: 20px;
      }
      .card {
        padding: 16px;
      }
      .grid,
      .form {
        grid-template-columns: 1fr;
      }
      .form .full {
        grid-column: auto;
      }
      main {
        padding: 10px 16px;
      }
      .toolbar {
        gap: 8px;
      }
      .toolbar label {
        flex: 1;
        min-width: 130px;
      }
      .toolbar input,
      .toolbar select {
        width: 100%;
      }
      .chart {
        min-height: 170px;
      }
      h1 {
        font-size: 23px;
      }
    }
    @media print {
      body {
        background: white;
        color: black;
        font-size: 10pt;
      }
      header,
      nav,
      .toolbar,
      .actions,
      button,
      dialog,
      #message,
      .no-print {
        display: none !important;
      }
      main {
        max-width: none;
        padding: 0;
      }
      .card {
        break-inside: avoid;
        border: 0;
        padding: 12px 0;
        margin: 10px 0;
      }
      .cards {
        grid-template-columns: repeat(3, 1fr);
      }
      .scroll {
        overflow: visible;
        max-height: none;
      }
      table {
        white-space: normal;
      }
      th {
        position: static;
      }
      .print-title {
        display: block;
        text-align: center;
      }
      .chart svg {
        max-height: 260px;
      }
      .page-footer {
        position: fixed;
        bottom: 0;
      }
      .notice {
        background: transparent;
        border: 1px solid #ccc;
      }
      footer:after {
        content: " · 페이지 " counter(page);
      }
      @page {
        size: A4 portrait;
        margin: 15mm;
        @bottom-center {
          content: "사이교회 재무관리 · " counter(page) " / " counter(pages);
          font-size: 9pt;
        }
      }
    }
  </style>
  <header>
    <b>사이교회 재무관리</b
    ><small id="scope">복식부기 · 헌금 · 시각화 재정보고</small
    ><button id="logout" hidden>로그아웃</button>
  </header>
  <nav id="nav"></nav>
  <main>
    <div id="message" role="alert"></div>
    <section id="login" class="card login" hidden>
      <h1>관리자 로그인</h1>
      <p>기존 데스크톱 계정으로 로그인하세요.</p>
      <form id="loginform">
        <label
          >사용자 ID<input
            name="id"
            required
            autocomplete="username"
            value="관리자" /></label
        ><label
          >비밀번호<input
            name="password"
            type="password"
            required
            autocomplete="current-password" /></label
        ><button class="primary">로그인</button>
      </form>
    </section>
    <section id="app" hidden>
      <div class="print-title">
        <h1>사이교회 재무상태 보고서</h1>
        <p id="print-period"></p>
      </div>
      <h1 id="heading"></h1>
      <div class="toolbar">
        <label>시작일<input type="date" id="from" /></label
        ><label>기준일 / 종료일<input type="date" id="to" /></label
        ><button id="refresh" class="primary">조회</button
        ><label
          >집계 단위<select id="grain">
            <option value="month">월</option>
            <option value="quarter">분기</option>
            <option value="year">연도</option>
          </select></label
        ><label><input type="checkbox" id="cumulative" />누적값</label
        ><label id="personlabel"
          >헌금자<select id="person">
            <option value="">전체</option>
          </select></label
        ><label id="typelabel"
          >헌금 종류<select id="giftType">
            <option value="">전체</option>
          </select></label
        ><label id="audienceLabel"
          >공개 범위<select id="audience">
            <option value="internal">내부용</option>
            <option value="external">외부 공개용 (개인정보 제외)</option>
          </select></label
        ><label
          >보고서 구성<select id="detail">
            <option value="summary">요약</option>
            <option value="full">상세</option>
          </select></label
        ><button onclick="window.print()">인쇄 / PDF 저장</button>
      </div>
      <div id="content"></div>
      <footer>
        사이교회 재무관리 · 표·그래프·보고서는 같은 집계값을 사용합니다. 생성일
        <span id="generated"></span>
      </footer>
    </section>
  </main>
  <dialog id="modal">
    <div class="actions">
      <h2 id="modalTitle"></h2>
      <button id="close">닫기</button>
    </div>
    <div id="modalContent"></div>
  </dialog>
  <script>
    "use strict";
    const $ = (id) => document.getElementById(id),
      esc = (v) =>
        String(v ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        ),
      money = (v) => BigInt(v ?? 0).toLocaleString("ko-KR"),
      M = (v) => money(v) + "원";
    const publicMode =
        location.port === "8766" ||
        /^\/[A-Za-z0-9_-]{40,}/.test(location.pathname),
      publicBase = location.pathname.replace(/\/$/, "");
    let readOnly = false,
      data = {},
      report = {},
      gifts = [],
      timeline = [],
      comparison = {},
      recent = {},
      page = decodeURIComponent(location.hash.slice(1)) || "대시보드",
      charts = new Map(),
      chartId = 0;
    const names = [
      "대시보드",
      "거래",
      "헌금 관리",
      "헌금자",
      "계정과목",
      "재무상태표",
      "통계",
      "재무상태 보고서",
      "외부 조회",
    ];
    $("from").value = new Date().getFullYear() + "-01-01";
    $("to").value = new Date().toLocaleDateString("sv-SE");
    $("generated").textContent = new Date().toLocaleString("ko-KR");
    const typeName = (t) =>
      ({
        ASSET: "자산",
        LIABILITY: "부채",
        EQUITY: "순자산",
        INCOME: "수익",
        EXPENSE: "비용",
      })[t] || t;
    const projected = () => publicMode || $("audience").value === "external";
    const period = () => "?from=" + $("from").value + "&to=" + $("to").value;
    async function api(path, body) {
      const r = await fetch(path, {
        method: body ? "POST" : "GET",
        headers: body ? { "Content-Type": "application/json" } : {},
        body: body ? JSON.stringify(body) : undefined,
        cache: "no-store",
      });
      let j;
      try {
        j = await r.json();
      } catch {
        throw Error("서버 응답을 확인하세요.");
      }
      if (!r.ok) {
        if (r.status === 403 && !publicMode) {
          $("login").hidden = false;
          $("app").hidden = true;
        }
        throw Error(j.error || "처리하지 못했습니다.");
      }
      return j;
    }
    function message(e) {
      $("message").innerHTML = e
        ? '<div class="notice error">' + esc(e.message || e) + "</div>"
        : "";
    }
    $("loginform").onsubmit = async (e) => {
      e.preventDefault();
      try {
        await api("/api/login", Object.fromEntries(new FormData(e.target)));
        await load();
      } catch (x) {
        message(x);
      }
    };
    $("logout").onclick = async () => {
      await api("/api/logout", {});
      location.reload();
    };
    $("close").onclick = () => $("modal").close();
    function modal(title, html) {
      $("modalTitle").textContent = title;
      $("modalContent").innerHTML = html;
      $("modal").showModal();
    }
    function table(headers, rows, attrs = "") {
      return (
        '<div class="scroll"><table ' +
        attrs +
        "><thead><tr>" +
        headers.map((h) => "<th>" + esc(h) + "</th>").join("") +
        "</tr></thead><tbody>" +
        rows
          .map(
            (r) =>
              "<tr>" + r.map((c) => "<td>" + c + "</td>").join("") + "</tr>",
          )
          .join("") +
        "</tbody></table></div>"
      );
    }
    function cards() {
      return (
        '<div class="cards">' +
        [
          ["총자산", "assets"],
          ["총부채", "liabilities"],
          ["순자산", "netAssets"],
          ["기간 수입", "income"],
          ["기간 비용", "expense"],
          ["기간 운영결과", "surplus"],
          ["기간 총헌금", "offeringsTotal"],
          ["현금·예금 잔액", "cashBalance"],
        ]
          .map(
            ([label, key]) =>
              '<div class="card" role="button" tabindex="0" data-metric="' +
              key +
              '"><small>' +
              label +
              "</small><strong>" +
              M(report[key]) +
              "</strong></div>",
          )
          .join("") +
        "</div>"
      );
    }
    async function load() {
      message("");
      try {
        if (projected()) {
          if (!["대시보드", "재무상태표", "재무상태 보고서"].includes(page))
            page = "대시보드";
          report = await api(
            (publicMode ? publicBase + "/data" : "/api/public-preview") +
              period(),
          );
          timeline = [];
          comparison = {};
          recent = {};
          data = {};
          gifts = [];
          $("scope").textContent = "개인정보 없는 공개용 · 읽기 전용";
          $("nav").innerHTML = ["대시보드", "재무상태표", "재무상태 보고서"]
            .map((n) => '<button data-nav="' + n + '">' + n + "</button>")
            .join("");
          $("personlabel").hidden = true;
          $("typelabel").hidden = true;
        } else {
          const me = await api("/api/me");
          readOnly = !me.admin;
          if (readOnly) {
            [report, timeline, comparison, recent] = await Promise.all([
              api("/api/report" + period()),
              api("/api/timeline" + period()),
              api("/api/comparison" + period()),
              api("/api/recent" + period()),
            ]);
            data = {};
            gifts = [];
            $("nav").innerHTML = ["대시보드", "재무상태표", "재무상태 보고서"]
              .map((n) => '<button data-nav="' + n + '">' + n + "</button>")
              .join("");
            if (!["대시보드", "재무상태표", "재무상태 보고서"].includes(page))
              page = "대시보드";
          } else {
            [data, report, gifts, timeline, comparison, recent] =
              await Promise.all([
                api("/api/data"),
                api("/api/report" + period()),
                api(
                  "/api/donations?from=" +
                    ($("from").value.slice(0, 4) - 1) +
                    "-01-01&to=" +
                    $("to").value.slice(0, 4) +
                    "-12-31",
                ),
                api("/api/timeline" + period()),
                api("/api/comparison" + period()),
                api("/api/recent" + period()),
              ]);
            $("logout").hidden = false;
            $("nav").innerHTML = names
              .map((n) => '<button data-nav="' + n + '">' + n + "</button>")
              .join("");
            const old = $("person").value,
              t = $("giftType").value;
            $("person").innerHTML =
              '<option value="">전체</option><option value="unallocated">미배분 그룹 헌금</option>' +
              (data.contacts || [])
                .map(
                  (c) =>
                    '<option value="' + c.ID + '">' + esc(c.NAME) + "</option>",
                )
                .join("");
            $("person").value = old;
            $("giftType").innerHTML =
              '<option value="">전체</option>' +
              (data.types || [])
                .map(
                  (t) =>
                    '<option value="' + t.ID + '">' + esc(t.NAME) + "</option>",
                )
                .join("");
            $("giftType").value = t;
          }
        }
        $("login").hidden = true;
        $("app").hidden = false;
        $("logout").hidden = publicMode;
        render();
      } catch (e) {
        message(e);
      }
    }
    function pendingOfferings() {
      return (data.records || []).filter(
        (r) =>
          r.TYPE === "INCOME" &&
          !r.OFFERING_TYPE_ID &&
          r.DATE >= $("from").value &&
          r.DATE <= $("to").value,
      );
    }
    function offeringMatch(r) {
      const budget = (data.budgets || []).find((b) => b.ID === r.BUDGET_ID);
      return (data.types || []).find(
        (t) => t.ACTIVE && t.NAME === budget?.NAME,
      );
    }
    function reviewOfferings() {
      const rows = pendingOfferings();
      modal(
        "헌금 연결 확인",
        '<p>기존 수입이 헌금 종류에 연결되지 않으면 헌금 통계에 포함되지 않습니다. 아래 원본 거래를 확인하세요. 예산명이 헌금 종류와 정확히 같은 항목만 선택할 수 있습니다. 통장과 종류가 다르면 개별 상세에서 지정하세요.</p><form id="linkOfferings">' +
          table(
            ["선택", "일자", "예산", "내용", "금액", "상세"],
            rows.map((r) => {
              const match = offeringMatch(r),
                year = (data.years || []).find(
                  (y) => y.ID === r.FISCAL_YEAR_ID,
                ),
                asset = (data.accounts || []).find(
                  (a) =>
                    a.ID === r.ASSET_ID || (!r.ASSET_ID && a.CODE === "1100"),
                );
              return [
                '<input type="checkbox" name="ids" value="' +
                  r.ID +
                  '" ' +
                  (!match || year?.CLOSED ? "disabled" : "") +
                  ">",
                esc(r.DATE),
                esc(
                  (data.budgets || []).find((b) => b.ID === r.BUDGET_ID)?.NAME,
                ),
                esc(r.DESCRIPTION) +
                  "<br><small>" +
                  esc(
                    match
                      ? "연결 종류: " +
                          match.NAME +
                          " / 자산: " +
                          (asset?.NAME || "보통예금")
                      : "헌금 종류를 개별 지정하세요",
                  ) +
                  "</small>",
                M(r.AMOUNT),
                '<button type="button" data-record="' +
                  r.ID +
                  '">개별 확인</button>',
              ];
            }),
          ) +
          '<button class="primary">선택한 수입을 헌금에 연결</button></form>',
      );
      $("linkOfferings").onsubmit = async (e) => {
        e.preventDefault();
        const ids = new FormData(e.target).getAll("ids");
        if (!ids.length) {
          alert("연결할 항목을 선택하세요.");
          return;
        }
        if (
          !confirm(
            "선택한 " +
              ids.length +
              "건을 표시된 헌금 종류로 연결할까요? 원본 수입을 중복 생성하지 않습니다.",
          )
        )
          return;
        try {
          await api("/api/write", { operation: "linkOfferings", ids });
          $("modal").close();
          await load();
        } catch (x) {
          alert(x.message);
        }
      };
    }
    function filteredGifts() {
      return gifts.filter(
        (g) =>
          g.DATE >= $("from").value &&
          g.DATE <= $("to").value &&
          (!$("person").value ||
            ($("person").value === "unallocated"

    function group(rows, label, amount) {
      const map = new Map();
      rows.forEach((r) => {
        const key = label(r);
        map.set(key, (map.get(key) || 0n) + amount(r));

      return [...map]
        .sort((a, b) => a[0].localeCompare(b[0]))

    function chart(
      title,
      rows,
      keys = [["value", "금액"]],
      onClick = null,
      initial = "bar",
    ) {
      const stock = keys.some(([k]) =>
        ["assets", "liabilities", "netAssets"].includes(k),

      if (rows.length && rows.every((r) => /^\d{4}-\d{2}$/.test(r.label))) {
        const groups = new Map();
        for (const r of rows) {
          const label =
            $("grain").value === "year"
              ? r.label.slice(0, 4)
              : $("grain").value === "quarter"
                ? r.label.slice(0, 4) + "-Q" + Math.ceil(+r.label.slice(5) / 3)
                : r.label;
          if (!groups.has(label)) groups.set(label, { label });
          const target = groups.get(label);
          for (const [k] of keys)
            target[k] = stock
              ? String(r[k] || 0)
              : String(BigInt(target[k] || 0) + BigInt(r[k] || 0));
        }
        rows = [...groups.values()];
        if ($("cumulative").checked && !stock) {
          const totals = {};
          rows = rows.map((r) => {
            const n = { ...r };
            for (const [k] of keys) {
              totals[k] = (totals[k] || 0n) + BigInt(r[k] || 0);
              n[k] = String(totals[k]);
            }
            return n;

      }
      const id = "chart-" + ++chartId;
      charts.set(id, { rows, keys, onClick, title });
      return (
        '<section class="card" id="' +
        id +
        '"><h2>' +
        esc(title) +

        id +
        '">' +
        [
          ["bar", "막대"],
          ["line", "꺾은선"],
          ["mixed", "막대 + 꺾은선"],
          ["stack", "누적 막대"],
          ["pie", "원형"],
          ["donut", "도넛"],
        ]
          .map(
            ([v, n]) =>
              "<option " +
              (v === initial ? "selected" : "") +
              ' value="' +
              v +
              '">' +
              n +
              "</option>",
          )
          .join("") +
        '</select><select data-chart-view="' +
        id +
        '"><option value="both">표 + 그래프</option><option value="only-table">표만</option><option value="only-chart">그래프만</option></select><button data-save-chart="' +
        id +
        '">이미지 저장</button><label><input type="checkbox" data-values="' +
        id +
        '">값 표시</label></div><div class="legend">' +
        keys
          .map(
            ([k, n], i) =>
              '<label><input type="checkbox" data-series="' +
              id +
              '" value="' +
              k +
              '" checked><span style="color:' +
              ["#2596cc", "#d58e67", "#61a58c", "#a58bc4"][i % 4] +
              '">●</span>' +
              esc(n) +
              "</label>",
          )
          .join("") +
        '</div><p class="muted chart-note" hidden></p><div class="chart"></div><div class="chart-table">' +
        table(
          ["항목", ...keys.map((x) => x[1])],
          rows.map((r, i) => [
            '<button class="text" data-point="' +
              i +
              '" data-parent="' +
              id +
              '">' +
              esc(r.label) +
              "</button>",
            ...keys.map(([k]) => M(r[k] || 0)),
          ]),
        ) +
        "</div></section>"
      );
    }
    function draw(id) {
      const c = charts.get(id),
        box = $(id);
      if (!box) return;
      const kind = box.querySelector("[data-chart-kind]").value,
        keys = c.keys.filter(
          ([k]) =>
            box.querySelector('[data-series][value="' + k + '"]').checked,
        ),
        rows = c.rows;
      if (!rows.length || !keys.length) {
        box.querySelector(".chart").innerHTML =
          '<p class="muted">표시할 자료가 없습니다.</p>';
        return;
      }
      const W = 900,
        H = 300,
        left = 70,
        bottom = rows.some((r) => keys.some(([k]) => BigInt(r[k] || 0) < 0n))
          ? 150
          : 250,
        palette = [
          "#2596cc",
          "#d58e67",
          "#61a58c",
          "#a58bc4",
          "#dbad4d",
          "#5d819b",
        ];
      let svg =
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' +
          W +
          " " +
          H +
          '" role="img" aria-label="' +
          esc(c.title) +
          '">',
        max = 1n;
      rows.forEach((r) => {
        let sum = 0n;
        keys.forEach(([k]) => {
          const n = BigInt(r[k] || 0);
          if ((n < 0n ? -n : n) > max) max = n < 0n ? -n : n;
          sum += n;
        });
        if (kind === "stack") {
          const pos = keys.reduce(
              (n, [k]) => n + (BigInt(r[k] || 0) > 0n ? BigInt(r[k]) : 0n),
              0n,
            ),
            neg = keys.reduce(
              (n, [k]) => n + (BigInt(r[k] || 0) < 0n ? -BigInt(r[k]) : 0n),
              0n,
            );
          if (pos > max) max = pos;
          if (neg > max) max = neg;
        }
      });
      const height = (n) =>
          Number((BigInt(n || 0) * (bottom === 150 ? 100n : 200n)) / max),
        showValues = box.querySelector("[data-values]").checked;
      const note = box.querySelector(".chart-note");
      note.hidden = !(kind === "pie" || kind === "donut");
      note.textContent =
        "선택한 첫 계열 (" +
        keys[0][1] +
        ")의 구성비입니다. 표에서 전체 계열을 확인할 수 있습니다.";
      if (kind === "pie" || kind === "donut") {
        const total = rows.reduce((s, r) => s + BigInt(r[keys[0][0]] || 0), 0n);
        if (total <= 0n || rows.some((r) => BigInt(r[keys[0][0]] || 0) < 0n)) {
          box.querySelector(".chart").innerHTML =
            '<p class="muted">0 또는 음수 구성비는 원형 대신 막대·꺾은선으로 확인하세요.</p>';
          return;
        }
        let angle = 0;
        rows.forEach((r, i) => {
          const fraction =
              Number((BigInt(r[keys[0][0]] || 0) * 1000000n) / total) / 1000000,
            a = angle,
            b = angle + fraction * Math.PI * 2;
          angle = b;
          const x = (a) => 450 + 110 * Math.cos(a - Math.PI / 2),
            y = (a) => 140 + 110 * Math.sin(a - Math.PI / 2);
          if (fraction >= 0.999999)
            svg +=
              '<circle cx="450" cy="140" r="110" fill="' +
              palette[i % palette.length] +
              '" data-point="' +
              i +
              '"><title>' +
              esc(r.label) +
              " " +
              M(r[keys[0][0]]) +
              "</title></circle>";
          else
            svg +=
              '<path d="M450,140 L' +
              x(a) +
              "," +
              y(a) +
              " A110,110 0 " +
              (fraction > 0.5 ? 1 : 0) +
              ",1 " +
              x(b) +
              "," +
              y(b) +
              ' Z" fill="' +
              palette[i % palette.length] +
              '" data-point="' +
              i +
              '"><title>' +
              esc(r.label) +
              " " +
              M(r[keys[0][0]]) +
              "</title></path>";
          if (showValues && fraction > 0) {
            const mid = (a + b) / 2;
            svg +=
              '<text x="' +
              (450 + 125 * Math.cos(mid - Math.PI / 2)) +
              '" y="' +
              (140 + 125 * Math.sin(mid - Math.PI / 2)) +
              '" font-size="10" text-anchor="middle">' +
              esc(r.label) +
              " " +
              M(r[keys[0][0]]) +
              "</text>";
          }
        });
        if (kind === "donut")
          svg +=
            '<circle cx="450" cy="140" r="65" fill="white"/><text x="450" y="145" text-anchor="middle">' +
            money(total) +
            "</text>";
      } else {
        svg +=
          '<path d="M' +
          left +
          ",20 V" +
          bottom +
          ' H880" stroke="#cbd8e0" fill="none"/>';
        const step = 800 / Math.max(rows.length, 1);
        keys.forEach(([key, name], ki) => {
          const line =
            kind === "line" || (kind === "mixed" && ki === keys.length - 1);
          let points = [];
          rows.forEach((r, i) => {
            const v = BigInt(r[key] || 0),
              h = height(v),
              x = left + step * (i + 0.5),
              y = bottom - h;
            const title = esc(r.label + " · " + name + " " + M(v));
            if (line) {
              points.push(x + "," + y);
              svg +=
                '<circle cx="' +
                x +
                '" cy="' +
                y +
                '" r="5" fill="' +
                palette[ki % 6] +
                '" data-point="' +
                i +
                '"><title>' +
                title +
                "</title></circle>";
            } else {
              const prev =
                  kind === "stack"
                    ? keys
                        .slice(0, ki)
                        .reduce(
                          (s, [k]) =>
                            s +
                            (BigInt(r[k] || 0) < 0n === v < 0n
                              ? BigInt(r[k] || 0)
                              : 0n),
                          0n,
                        )
                    : 0n,
                bw = Math.max(
                  1,
                  Math.min(45, step / (kind === "stack" ? 1 : keys.length + 1)),
                );
              svg +=
                '<rect x="' +
                (kind === "stack" ? x - bw / 2 : x - step * 0.3 + ki * bw) +
                '" y="' +
                (bottom - height(prev) - Math.max(h, 0)) +
                '" width="' +
                bw +
                '" height="' +
                Math.abs(h) +
                '" fill="' +
                palette[ki % 6] +
                '" data-point="' +
                i +
                '" tabindex="0"><title>' +
                title +
                "</title></rect>";
            }
            if (showValues)
              svg +=
                '<text x="' +
                x +
                '" y="' +
                (y - 8) +
                '" font-size="9" text-anchor="middle">' +
                money(v) +
                "</text>";
            if (ki === 0 && i % Math.max(1, Math.ceil(rows.length / 12)) === 0)
              svg +=
                '<text x="' +
                x +
                '" y="275" font-size="10" text-anchor="middle">' +
                esc(r.label) +
                "</text>";
          });
          if (line)
            svg +=
              '<polyline points="' +
              points.join(" ") +
              '" fill="none" stroke="' +
              palette[ki % 6] +
              '" stroke-width="2"/>';
        });
      }
      box.querySelector(".chart").innerHTML = svg + "</svg>";
      box
        .querySelectorAll("svg [data-point]")
        .forEach((n) => (n.onclick = () => drill(id, +n.dataset.point)));
    }

        '<section class="card"><h2>재무상태표 · ' +

                          M(BigInt(report.netAssets) - sum),
                        ],
                      ]

                  [
                    "<b>" + typeName(t) + " 총계</b>",
                    "",
                    "<b>" +
                      M(
                        report[

                            ASSET: "assets",
                            LIABILITY: "liabilities",
                            EQUITY: "netAssets",
                          }[t]
                        ],
                      ) +
                      "</b>",
                  ],

    function annual(gs) {
      const people = new Map();
      gs.forEach((g) => {
        const donor = g.CONTACT_ID || "unallocated",
          id = donor + "|" + g.DATE.slice(0, 4);
        if (!people.has(id))
          people.set(id, {
            donor,
            year: g.DATE.slice(0, 4),
            name: g.CONTACT_NAME || "미배분 그룹 헌금",
            months: Array(12).fill(0n),
          });
        people.get(id).months[+g.DATE.slice(5, 7) - 1] += giftAmount(g);
      });
      return table(
        [
          "헌금자",
          ...Array.from({ length: 12 }, (_, i) => i + 1 + "월"),
          "조회 합계",
        ],
        [...people].map(([id, p]) => [
          esc(p.name + " · " + p.year),
          ...p.months.map(
            (n, i) =>
              '<button data-donor="' +
              p.donor +
              '" data-year="' +
              p.year +
              '" data-month="' +
              (i + 1) +
              '">' +
              money(n) +
              "</button>",
          ),
          M(p.months.reduce((a, b) => a + b, 0n)),
        ]),
      );
    }
    function setMonth(m) {
      if (/^\d{4}$/.test(m)) {
        $("from").value = m + "-01-01";
        $("to").value = m + "-12-31";
        return;
      }
      if (m.includes("-Q")) {
        const year = +m.slice(0, 4),
          q = +m.at(-1);
        $("from").value =
          year + "-" + String(q * 3 - 2).padStart(2, "0") + "-01";
        $("to").value = new Date(year, q * 3, 0).toLocaleDateString("sv-SE");
        return;
      }
      $("from").value = m + "-01";
      $("to").value = new Date(
        +m.slice(0, 4),
        +m.slice(5, 7),
        0,
      ).toLocaleDateString("sv-SE");
    }

              ">비활성</option>",
          ),
        t.ID ? { id: t.ID } : {},
      );
    }
    function contactForm(c = {}) {
      form(
        "헌금자 설정 · 과거 기록 유지",
        "contact",
        field("이름", "name", c.NAME || "") +
          field("메모", "memo", c.REMARKS || "") +
          select(
            "상태",
            "active",
            '<option value="true">활성</option><option value="false" ' +
              (c.IS_HIDDEN ? "selected" : "") +
              ">비활성 (제거 대신 기록 보존)</option>",
          ),
        c.ID ? { id: c.ID } : {},
      );
    }
    function journalForm() {
      modal(
        "전문 회계 입력 · 기초잔액",
        '<form id="journal" class="form">' +
          select("회계 연도", "year", opt(data.years, "ID", "NAME")) +
          field("일자", "date", $("to").value, "date") +
          field("적요", "memo", "수동 분개") +
          '<div id="journalLines" class="full"></div><button type="button" id="addLine">행 추가</button><button class="primary">균형 분개 저장</button></form>',
      );
      function line() {
        const div = document.createElement("div");
        div.className = "form";
        div.innerHTML =
          select(
            "계정",
            "accountId",
            opt(
              data.accounts.filter((a) => a.ACTIVE),
              "ID",
              "NAME",
            ),
          ) +
          field("차변", "debit", "0", "number") +
          field("대변", "credit", "0", "number");
        $("journalLines").append(div);
      }
      line();
      line();
      $("addLine").onclick = line;
      $("journal").onsubmit = async (e) => {
        e.preventDefault();
        try {
          const form = new FormData(e.target),
            lines = [...$("journalLines").children].map((x) =>
              Object.fromEntries(
                [...x.querySelectorAll("input,select")].map((i) => [
                  i.name,
                  i.value,
                ]),
              ),
            );
          await api("/api/write", {
            operation: "journal",
            year: form.get("year"),
            date: form.get("date"),
            memo: form.get("memo"),
            lines,
          });
          $("modal").close();
          await load();
        } catch (x) {
          alert(x.message);
        }
      };
    }
    document.addEventListener("click", async (e) => {
      const metric = e.target.closest("[data-metric]");
      if (metric) {
        metricDrill(metric.dataset.metric);
        return;
      }
      const b = e.target.closest("button");
      if (!b) return;
      if (b.hasAttribute("data-review-offerings")) {
        reviewOfferings();
        return;
      }
      if (b.hasAttribute("data-reset-gift-filters")) {
        $("person").value = "";
        $("giftType").value = "";
        await load();
        return;
      }

      try {
        if (b.dataset.nav) {
          page = b.dataset.nav;
          location.hash = page;
          render();
        } else if (b.dataset.point) drill(b.dataset.parent, +b.dataset.point);
        else if (b.hasAttribute("data-new-record")) recordForm();
        else if (b.hasAttribute("data-new-gift")) recordForm(true);
        else if (b.hasAttribute("data-new-contact")) contactForm();
        else if (b.hasAttribute("data-new-account")) accountForm();
        else if (b.hasAttribute("data-new-type")) typeForm();
        else if (b.hasAttribute("data-new-journal")) journalForm();
        else if (b.dataset.entry) journalDetail(b.dataset.entry);
        else if (
          b.dataset.reverseJournal &&
          confirm("원본 분개를 보존하고 역분개로 취소할까요?")
        ) {
          await api("/api/write", {
            operation: "reverseJournal",
            id: b.dataset.reverseJournal,
          });
          $("modal").close();
          await load();
        } else if (b.dataset.record) recordDetail(b.dataset.record);
        else if (b.dataset.editRecord) {
          $("modal").close();
          recordForm(
            false,
            data.records.find((r) => String(r.ID) === b.dataset.editRecord),
          );
        } else if (
          b.dataset.cancelRecord &&
          confirm("기록을 보존하고 역분개로 취소할까요?")
        ) {
          await api("/api/write", {
            operation: "cancel",
            id: b.dataset.cancelRecord,
          });
          $("modal").close();
          await load();
        } else if (b.dataset.account)
          accountForm(
            data.accounts.find((a) => String(a.ID) === b.dataset.account),
          );
        else if (b.dataset.type)
          typeForm(data.types.find((t) => String(t.ID) === b.dataset.type));
        else if (b.dataset.contact)
          contactForm(
            data.contacts.find((c) => String(c.ID) === b.dataset.contact),
          );
        else if (b.dataset.donor) {
          $("person").value = b.dataset.donor;
          setMonth(
            b.dataset.year + "-" + String(b.dataset.month).padStart(2, "0"),
          );
          render();
        } else if (
          b.dataset.share !== undefined ||
          b.hasAttribute("data-share-info")
        ) {
          const j = b.hasAttribute("data-share-info")
            ? await api("/api/share")
            : await api("/api/write", {
                operation: "share",
                enabled: b.dataset.share === "true",
              });
          $("shareResult").textContent = j.enabled
            ? "공개 ON · " + j.url + " · 같은 Wi-Fi/네트워크에서 열어 주세요."
            : "공개 OFF";
        } else if (b.dataset.saveChart) {
          const svg = $(b.dataset.saveChart).querySelector("svg");
          if (!svg) return;
          const blob = new Blob([new XMLSerializer().serializeToString(svg)], {
              type: "image/svg+xml",
            }),
            url = URL.createObjectURL(blob),
            a = document.createElement("a");
          a.href = url;
          a.download = "사이교회-그래프.svg";
          a.click();
          URL.revokeObjectURL(url);
        }
      } catch (x) {
        message(x);
      }
    });
    document.addEventListener("change", (e) => {
      const n = e.target;
      if (n.dataset.chartKind) draw(n.dataset.chartKind);
      else if (n.dataset.series) draw(n.dataset.series);
      else if (n.dataset.values) draw(n.dataset.values);
      else if (n.dataset.chartView)
        $(n.dataset.chartView).className = "card " + n.value;
    });
    $("refresh").onclick = load;
    $("person").onchange = render;
    $("giftType").onchange = render;
    $("detail").onchange = render;
    $("audience").onchange = () => {
      $("modal").close();
      load();
    };
    if (publicMode) $("audienceLabel").hidden = true;
    $("grain").onchange = render;
    $("cumulative").onchange = render;
    if (publicMode) page = "대시보드";
    load();
  </script>
</html>
