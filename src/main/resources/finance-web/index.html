<!doctype html>
<html lang="ko">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>사이교회 재무관리</title>
  <style>
    :root {
      --blue: #2596cc;
      --ink: #30465b;
      --muted: #78909e;
      --line: #e1e8ed;
      --bg: #f4f7fa;
      --red: #b85555;
    }
    * {
      box-sizing: border-box;
    }
    [hidden] {
      display: none !important;
    }
    body {
      margin: 0;
      font:
        14px system-ui,
        "Malgun Gothic",
        sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    button,
    input,
    select,
    textarea {
      font: inherit;
      border: 1px solid #d4dfe7;
      border-radius: 7px;
      padding: 10px;
      background: white;
      color: inherit;
    }
    button {
      cursor: pointer;
    }
    button.primary {
      background: var(--blue);
      color: white;
      border-color: var(--blue);
    }
    button:hover {
      filter: brightness(0.96);
    }
    header {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 20px 4vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    header b {
      font-size: 22px;
    }
    header small {
      color: var(--muted);
    }
    nav {
      display: flex;
      gap: 8px;
      padding: 17px 4vw;
      overflow: auto;
      white-space: nowrap;
    }
    nav button.active {
      background: var(--ink);
      color: white;
    }
    main {
      max-width: 1450px;
      margin: auto;
      padding: 10px 4vw 40px;
    }
    h1 {
      font-size: 26px;
    }
    h2 {
      font-size: 18px;
    }
    h3 {
      font-size: 15px;
    }
    p {
      line-height: 1.7;
    }
    .toolbar,
    .actions {
      display: flex;
      align-items: end;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .toolbar label,
    label {
      display: grid;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
      padding: 24px;
      margin: 18px 0;
      overflow: hidden;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .cards .card {
      margin: 0;
    }
    .cards small {
      display: block;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .cards strong {
      font-size: 24px;
    }
    .scroll {
      overflow: auto;
      max-height: 650px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      white-space: nowrap;
    }
    th,
    td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
    }
    th {
      background: #f6f9fb;
      position: sticky;
      top: 0;
    }
    td.num,
    th.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    tr.click {
      cursor: pointer;
    }
    tr.click:hover {
      background: #eff8fc;
    }
    .notice {
      background: #eaf4fb;
      padding: 14px;
      border-radius: 8px;
      line-height: 1.7;
      margin: 15px 0;
    }
    .error {
      color: var(--red);
      background: #fff0f0;
    }
    .muted {
      color: var(--muted);
      font-size: 12px;
    }
    .badge {
      background: #eaf4ef;
      color: #3c7962;
      border-radius: 5px;
      padding: 4px 8px;
      font-size: 11px;
    }
    .bad {
      color: var(--red);
    }
    .chart {
      min-height: 240px;
    }
    .chart svg {
      width: 100%;
      height: auto;
      max-height: 420px;
    }
    .chart svg text {
      font-family: inherit;
    }
    .chart [data-point] {
      cursor: pointer;
    }
    .legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px;
      font-size: 12px;
    }
    .legend label {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    .form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .form .full {
      grid-column: 1/-1;
    }
    .login {
      width: 420px;
      max-width: 95vw;
      margin: 12vh auto;
    }
    .login label {
      margin: 20px 0;
    }
    dialog {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px;
      width: 750px;
      max-width: 95vw;
      max-height: 90vh;
      overflow: auto;
    }
    dialog::backdrop {
      background: #20354988;
    }
    dialog input,
    dialog select {
      width: 100%;
    }
    #message {
      white-space: pre-wrap;
    }
    .only-table .chart,
    .only-table .legend {
      display: none;
    }
    .only-chart .chart-table {
      display: none;
    }
    .print-title {
      display: none;
    }
    a {
      color: #2081b5;
    }
    .public-hide {
      display: none !important;
    }
    footer {
      color: var(--muted);
      font-size: 11px;
      margin-top: 30px;
      border-top: 1px solid var(--line);
      padding-top: 20px;
    }
    @media (max-width: 750px) {
      header {
        padding: 18px;
      }
      header b {
        font-size: 19px;
      }
      header small {
        display: none;
      }
      nav {
        padding: 12px;
      }
      .cards {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .cards strong {
        font-size: 20px;
      }
      .card {
        padding: 16px;
      }
      .grid,
      .form {
        grid-template-columns: 1fr;
      }
      .form .full {
        grid-column: auto;
      }
      main {
        padding: 10px 16px;
      }
      .toolbar {
        gap: 8px;
      }
      .toolbar label {
        flex: 1;
        min-width: 130px;
      }
      .toolbar input,
      .toolbar select {
        width: 100%;
      }
      .chart {
        min-height: 170px;
      }
      h1 {
        font-size: 23px;
      }
    }
    @media print {
      body {
        background: white;
        color: black;
        font-size: 10pt;
      }
      header,
      nav,
      .toolbar,
      .actions,
      button,
      dialog,
      #message,
      .no-print {
        display: none !important;
      }
      main {
        max-width: none;
        padding: 0;
      }
      .card {
        break-inside: avoid;
        border: 0;
        padding: 12px 0;
        margin: 10px 0;
      }
      .cards {
        grid-template-columns: repeat(3, 1fr);
      }
      .scroll {
        overflow: visible;
        max-height: none;
      }
      table {
        white-space: normal;
      }
      th {
        position: static;
      }
      .print-title {
        display: block;
        text-align: center;
      }
      .chart svg {
        max-height: 260px;
      }
      .page-footer {
        position: fixed;
        bottom: 0;
      }
      .notice {
        background: transparent;
        border: 1px solid #ccc;
      }
      footer:after {
        content: " · 페이지 " counter(page);
      }
      @page {
        size: A4 portrait;
        margin: 15mm;
        @bottom-center {
          content: "사이교회 재무관리 · " counter(page) " / " counter(pages);
          font-size: 9pt;
        }
      }
    }
    .pledge-missing { display:inline-block; margin-left:6px; padding:3px 7px; border:1px solid #d12f3e; border-radius:4px; background:#c92a3c; color:#fff; font-weight:700; white-space:nowrap; }
  </style>
  <header>
    <b>사이교회 재무관리</b
    ><small id="scope">복식부기 · 헌금 · 시각화 재정보고</small
    ><button id="logout" hidden>로그아웃</button>
  </header>
  <nav id="nav"></nav>
  <main>
    <div id="message" role="alert"></div>
    <section id="login" class="card login" hidden>
      <h1>관리자 로그인</h1>
      <p>기존 데스크톱 계정으로 로그인하세요.</p>
      <form id="loginform">
        <label
          >사용자 ID<input
            name="id"
            required
            autocomplete="username"
            value="관리자" /></label
        ><label
          >비밀번호<input
            name="password"
            type="password"
            required
            autocomplete="current-password" /></label
        ><button class="primary">로그인</button>
      </form>
    </section>
    <section id="app" hidden>
      <div class="print-title">
        <h1>사이교회 재무상태 보고서</h1>
        <p id="print-period"></p>
      </div>
      <h1 id="heading"></h1>
      <div class="toolbar">
        <label>시작일<input type="date" id="from" /></label
        ><label>기준일 / 종료일<input type="date" id="to" /></label
        ><button id="refresh" class="primary">조회</button
        ><label
          >집계 단위<select id="grain">
            <option value="month">월</option>
            <option value="quarter">분기</option>
            <option value="year">연도</option>
          </select></label
        ><label><input type="checkbox" id="cumulative" />누적값</label
        ><label id="personlabel"
          >헌금자<select id="person">
            <option value="">전체</option>
          </select></label
        ><label id="typelabel"
          >헌금 종류<select id="giftType">
            <option value="">전체</option>
          </select></label
        ><label id="audienceLabel"
          >공개 범위<select id="audience">
            <option value="internal">내부용</option>
            <option value="external">외부 공개용 (개인정보 제외)</option>
          </select></label
        ><label
          >보고서 구성<select id="detail">
            <option value="summary">요약</option>
            <option value="full">상세</option>
          </select></label
        ><button onclick="window.print()">인쇄 / PDF 저장</button>
      </div>
      <div id="content"></div>
      <footer>
        사이교회 재무관리 · 표·그래프·보고서는 같은 집계값을 사용합니다. 생성일
        <span id="generated"></span>
      </footer>
    </section>
  </main>
  <dialog id="modal">
    <div class="actions">
      <h2 id="modalTitle"></h2>
      <button id="close">닫기</button>
    </div>
    <div id="modalContent"></div>
  </dialog>
  <script>
    "use strict";
    const $ = (id) => document.getElementById(id),
      esc = (v) =>
        String(v ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        ),
      money = (v) => BigInt(v ?? 0).toLocaleString("ko-KR"),
      M = (v) => money(v) + "원";
    const publicMode =
        location.port === "8766" ||
        /^\/[A-Za-z0-9_-]{40,}/.test(location.pathname),
      publicBase = location.pathname.replace(/\/$/, "");
    let readOnly = false,
      data = {},
      pledgeStats = {},
      pledgeMonthStats = {},
      externalStats = [],
      report = {},
      gifts = [],
      timeline = [],
      comparison = {},
      recent = {},
      page = decodeURIComponent(location.hash.slice(1)) || "대시보드",
      charts = new Map(),
      chartId = 0;
    const names = [
      "대시보드",
      "거래",
      "헌금 관리",
      "헌금자",
      "외부 교회",
      "계정과목",
      "재무상태표",
      "통계",
      "재무상태 보고서",
      "외부 조회",
    ];
    $("from").value = new Date().getFullYear() + "-01-01";
    $("to").value = new Date().toLocaleDateString("sv-SE");
    $("generated").textContent = new Date().toLocaleString("ko-KR");
    const typeName = (t) =>
      ({
        ASSET: "자산",
        LIABILITY: "부채",
        EQUITY: "순자산",
        INCOME: "수익",
        EXPENSE: "비용",
      })[t] || t;
    const projected = () => publicMode || $("audience").value === "external";
    const period = () => "?from=" + $("from").value + "&to=" + $("to").value;
    async function api(path, body) {
      const r = await fetch(path, {
        method: body ? "POST" : "GET",
        headers: body ? { "Content-Type": "application/json" } : {},
        body: body ? JSON.stringify(body) : undefined,
        cache: "no-store",
      });
      let j;
      try {
        j = await r.json();
      } catch {
        throw Error("서버 응답을 확인하세요.");
      }
      if (!r.ok) {
        if (r.status === 403 && !publicMode) {
          $("login").hidden = false;
          $("app").hidden = true;
        }
        throw Error(j.error || "처리하지 못했습니다.");
      }
      return j;
    }
    function message(e) {
      $("message").innerHTML = e
        ? '<div class="notice error">' + esc(e.message || e) + "</div>"
        : "";
    }
    $("loginform").onsubmit = async (e) => {
      e.preventDefault();
      try {
        await api("/api/login", Object.fromEntries(new FormData(e.target)));
        await load();
      } catch (x) {
        message(x);
      }
    };
    $("logout").onclick = async () => {
      await api("/api/logout", {});
      location.reload();
    };
    $("close").onclick = () => $("modal").close();
    function modal(title, html) {
      $("modalTitle").textContent = title;
      $("modalContent").innerHTML = html;
      $("modal").showModal();
    }
    function table(headers, rows, attrs = "") {
      return (
        '<div class="scroll"><table ' +
        attrs +
        "><thead><tr>" +
        headers.map((h) => "<th>" + esc(h) + "</th>").join("") +
        "</tr></thead><tbody>" +
        rows
          .map(
            (r) =>
              "<tr>" + r.map((c) => "<td>" + c + "</td>").join("") + "</tr>",
          )
          .join("") +
        "</tbody></table></div>"
      );
    }
    function cards() {
      return (
        '<div class="cards">' +
        [
          ["총자산", "assets"],
          ["총부채", "liabilities"],
          ["순자산", "netAssets"],
          ["기간 수입", "income"],
          ["기간 비용", "expense"],
          ["기간 운영결과", "surplus"],
          ["기간 총헌금", "offeringsTotal"],
          ["현금·예금 잔액", "cashBalance"],
        ]
          .map(
            ([label, key]) =>
              '<div class="card" role="button" tabindex="0" data-metric="' +
              key +
              '"><small>' +
              label +
              "</small><strong>" +
              M(report[key]) +
              "</strong></div>",
          )
          .join("") +
        "</div>"
      );
    }
    async function load() {
      message("");
      try {
        if (projected()) {
          if (!["대시보드", "재무상태표", "재무상태 보고서"].includes(page))
            page = "대시보드";
          report = await api(
            (publicMode ? publicBase + "/data" : "/api/public-preview") +
              period(),
          );
          timeline = [];
          comparison = {};
          recent = {};
          data = {};
          gifts = [];
          $("scope").textContent = "개인정보 없는 공개용 · 읽기 전용";
          $("nav").innerHTML = ["대시보드", "재무상태표", "재무상태 보고서"]
            .map((n) => '<button data-nav="' + n + '">' + n + "</button>")
            .join("");
          $("personlabel").hidden = true;
          $("typelabel").hidden = true;
        } else {
          const me = await api("/api/me");
          readOnly = !me.admin;
          if (readOnly) {
            [report, timeline, comparison, recent] = await Promise.all([
              api("/api/report" + period()),
              api("/api/timeline" + period()),
              api("/api/comparison" + period()),
              api("/api/recent" + period()),
            ]);
            data = {};
            gifts = [];
            $("nav").innerHTML = ["대시보드", "재무상태표", "재무상태 보고서"]
              .map((n) => '<button data-nav="' + n + '">' + n + "</button>")
              .join("");
            if (!["대시보드", "재무상태표", "재무상태 보고서"].includes(page))
              page = "대시보드";
          } else {
            [data, report, gifts, timeline, comparison, recent] =
              await Promise.all([
                api("/api/data"),
                api("/api/report" + period()),
                api(
                  "/api/donations?from=" +
                    ($("from").value.slice(0, 4) - 1) +
                    "-01-01&to=" +
                    $("to").value.slice(0, 4) +
                    "-12-31",
                ),
                api("/api/timeline" + period()),
                api("/api/comparison" + period()),
                api("/api/recent" + period()),
              ]);
            $("logout").hidden = false;
            $("nav").innerHTML = names
              .map((n) => '<button data-nav="' + n + '">' + n + "</button>")
              .join("");
            const old = $("person").value,
              t = $("giftType").value;
            $("person").innerHTML =
              '<option value="">전체</option><option value="unallocated">미배분 그룹 헌금</option>' +
              (data.contacts || [])
                .map(
                  (c) =>
                    '<option value="' + c.ID + '">' + esc(c.NAME) + "</option>",
                )
                .join("");
            $("person").value = old;
            $("giftType").innerHTML =
              '<option value="">전체</option>' +
              (data.types || [])
                .map(
                  (t) =>
                    '<option value="' + t.ID + '">' + esc(t.NAME) + "</option>",
                )
                .join("");
            $("giftType").value = t;
          }
        }
        $("login").hidden = true;
        $("app").hidden = false;
        $("logout").hidden = publicMode;
        if(!projected() && !readOnly){[pledgeStats,pledgeMonthStats,externalStats]=await Promise.all([api('/api/pledges'+period()),api('/api/pledges?from='+$('to').value.slice(0,7)+'-01&to='+$('to').value),api('/api/external-churches'+period())]);}
        else {pledgeStats={};pledgeMonthStats={};externalStats=[];}
        render();
      } catch (e) {
        message(e);
      }
    }
    function selectionActions() {
      return '<div class="actions"><label><input type="checkbox" data-record-select-all>전체 선택</label><button data-cancel-selected>선택 삭제</button><span id="selectionCount">0건 선택</span></div>';
    }
    function recordCheck(id) {
      return (
        '<input type="checkbox" data-record-select="' +
        id +
        '" aria-label="거래 선택">'
      );
    }
    document.addEventListener("change", (e) => {
      if (e.target.hasAttribute("data-record-select-all"))
        document
          .querySelectorAll("[data-record-select]")
          .forEach((x) => (x.checked = e.target.checked));
      if (
        e.target.hasAttribute("data-record-select") ||
        e.target.hasAttribute("data-record-select-all")
      ) {
        const n = new Set(
          [...document.querySelectorAll("[data-record-select]:checked")].map(
            (x) => x.dataset.recordSelect,
          ),
        ).size;
        if ($("selectionCount"))
          $("selectionCount").textContent = n + "건 선택";
      }
    });
    function pendingOfferings() {
      return (data.records || []).filter(
        (r) =>
          r.TYPE === "INCOME" &&
          !r.OFFERING_TYPE_ID && !r.EXTERNAL_CHURCH_ID &&
          r.DATE >= $("from").value &&
          r.DATE <= $("to").value,
      );
    }
    function offeringMatch(r) {
      const budget = (data.budgets || []).find((b) => b.ID === r.BUDGET_ID);
      return (data.types || []).find(
        (t) => t.ACTIVE && t.NAME === budget?.NAME,
      );
    }
    function reviewOfferings() {
      const rows = pendingOfferings();
      modal(
        "헌금 연결 확인",
        '<p>기존 수입이 헌금 종류에 연결되지 않으면 헌금 통계에 포함되지 않습니다. 아래 원본 거래를 확인하세요. 예산명이 헌금 종류와 정확히 같은 항목만 선택할 수 있습니다. 통장과 종류가 다르면 개별 상세에서 지정하세요.</p><form id="linkOfferings">' +
          table(
            ["선택", "일자", "예산", "내용", "금액", "상세"],
            rows.map((r) => {
              const match = offeringMatch(r),
                year = (data.years || []).find(
                  (y) => y.ID === r.FISCAL_YEAR_ID,
                ),
                asset = (data.accounts || []).find(
                  (a) =>
                    a.ID === r.ASSET_ID || (!r.ASSET_ID && a.CODE === "1100"),
                );
              return [
                '<input type="checkbox" name="ids" value="' +
                  r.ID +
                  '" ' +
                  (!match || year?.CLOSED ? "disabled" : "") +
                  ">",
                esc(r.DATE),
                esc(

    function balanceTable() {
      const as = report.accounts || [];
      return (
        '<section class="card"><h2>재무상태표 · ' +
        esc($("to").value) +
        '</h2><div class="notice">자산 ' +
        M(report.assets) +
        " = 부채 " +
        M(report.liabilities) +
        " + 순자산 " +
        M(report.netAssets) +
        " · 검증 차이 " +
        M(report.difference) +
        "</div>" +
        (projected()
          ? table(
              ["구분", "금액"],
              [
                ["자산", M(report.assets)],
                ["부채", M(report.liabilities)],
                ["순자산", M(report.netAssets)],
              ],
            )
          : table(
              ["구분", "계정과목", "금액"],
              ["ASSET", "LIABILITY", "EQUITY"].flatMap((t) => {
                const accounts = as.filter((a) => a.TYPE === t),
                  sum = accounts.reduce(
                    (n, a) =>
                      n + BigInt(a.BALANCE) * (t === "ASSET" ? 1n : -1n),
                    0n,
                  );
                return [
                  ...accounts.map((a) => [
                    typeName(t),
                    esc(a.NAME),
                    M(BigInt(a.BALANCE) * (t === "ASSET" ? 1n : -1n)),
                  ]),
                  ...(t === "EQUITY"
                    ? [
                        [
                          typeName(t),
                          "미처분 누적 운영결과",
                          M(BigInt(report.netAssets) - sum),
                        ],
                      ]
                    : []),
                  [
                    "<b>" + typeName(t) + " 총계</b>",
                    "",
                    "<b>" +
                      M(
                        report[
                          {
                            ASSET: "assets",
                            LIABILITY: "liabilities",
                            EQUITY: "netAssets",
                          }[t]
                        ],
                      ) +
                      "</b>",
                  ],
                ];
              }),
            )) +
        (BigInt(report.liabilities) === 0n
          ? "<p>현재 등록된 부채가 없습니다.</p>"
          : "") +
        "<p>수익·비용 누계 운영결과는 순자산에 포함됩니다.</p></section>"
      );

    function annual(gs) {
      const people = new Map();
      gs.forEach((g) => {
        const donor = g.CONTACT_ID || "unallocated",
          id = donor + "|" + g.DATE.slice(0, 4);
        if (!people.has(id))
          people.set(id, {
            donor,
            year: g.DATE.slice(0, 4),
            name: g.CONTACT_NAME || "미배분 그룹 헌금",
            months: Array(12).fill(0n),
          });
        people.get(id).months[+g.DATE.slice(5, 7) - 1] += giftAmount(g);
      });
      return table(
        [
          "헌금자",
          ...Array.from({ length: 12 }, (_, i) => i + 1 + "월"),
          "조회 합계",
        ],
        [...people].map(([id, p]) => [
          esc(p.name + " · " + p.year),
          ...p.months.map(
            (n, i) =>
              '<button data-donor="' +
              p.donor +
              '" data-year="' +
              p.year +
              '" data-month="' +
              (i + 1) +
              '">' +
              money(n) +
              "</button>",
          ),
          M(p.months.reduce((a, b) => a + b, 0n)),
        ]),
      );
    }
    function setMonth(m) {
      if (/^\d{4}$/.test(m)) {
        $("from").value = m + "-01-01";
        $("to").value = m + "-12-31";
        return;
      }
      if (m.includes("-Q")) {
        const year = +m.slice(0, 4),
          q = +m.at(-1);
        $("from").value =
          year + "-" + String(q * 3 - 2).padStart(2, "0") + "-01";
        $("to").value = new Date(year, q * 3, 0).toLocaleDateString("sv-SE");
        return;
      }
      $("from").value = m + "-01";
      $("to").value = new Date(
        +m.slice(0, 4),
        +m.slice(5, 7),
        0,
      ).toLocaleDateString("sv-SE");
    }
    function monthRecords(m) {
      if (projected()) return;

    function form(title, operation, fields, hidden = {}) {
      modal(
        title,
        '<form id="editForm" class="form">' +
          fields +
          '<button class="primary full">저장</button></form>',
      );
      $("editForm").onsubmit = async (e) => {
        e.preventDefault();
        try {
          const fd = new FormData(e.target),
            body = { operation, ...hidden, ...Object.fromEntries(fd) };
          if (operation === "pledge" && !String(body.end || "").trim()) delete body.end;
          if(operation==='linkExternalChurch'){body.ids=fd.getAll('ids');if(body.church==='')body.church=null;}
          if (fd.has("contacts")) body.contacts = fd.getAll("contacts");
          if (operation === "record" && String(body.donorName || "").trim())
            delete body.contacts;
          if (body.active !== undefined) body.active = body.active === "true";
          if (body.offering === "") body.offering = null;
          if (body.offering === "auto") delete body.offering;
          if (operation === "record" && !fd.has("manualAccounting"))
            delete body.counterpart;
          await api("/api/write", body);
          $("modal").close();
          await load();
        } catch (x) {
          message(x);
          alert(x.message);
        }
      };

      if (["income", "expense", "surplus"].includes(key)) {
        const types =
          key === "income"
            ? ["INCOME"]
            : key === "expense"
              ? ["EXPENSE"]
              : ["INCOME", "EXPENSE"];
        const ids = (data.accounts || [])
          .filter((a) => types.includes(a.TYPE))
          .map((a) => a.ID);
        ledgerModal("기간 수익·비용 분개", (l) => ids.includes(l.ACCOUNT_ID));

      }

        try {
          const ids = (data.records || [])
            .filter(
              (r) =>
                r.TYPE === "INCOME" &&
                r.DATE >= $("from").value &&
                r.DATE <= $("to").value,
            )
            .map((r) => r.ID);

        )

        return;

        return;

          await load();

            operation: "cancel",

          typeForm(data.types.find((t) => String(t.ID) === b.dataset.type));

            a = document.createElement("a");
          a.href = url;
          a.download = "사이교회-그래프.svg";
          a.click();
          URL.revokeObjectURL(url);
        }

        message(x);
