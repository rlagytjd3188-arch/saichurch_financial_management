name: Windows app
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and package modified application
        shell: pwsh
        run: .\gradlew.bat --no-daemon --max-workers=2 test spotlessCheck bootJar packageWindows
      - uses: actions/upload-artifact@v6
        with:
          name: SaiChurch-Windows
          path: build/distributions/ChurchSteward-*-windows.zip
          if-no-files-found: error
